services:
  sdk-proxy:
    build: .
    container_name: accumulate-sdk-proxy
    restart: unless-stopped
    # Internal only — no host port mapping. Caddy terminates TLS and is the
    # sole way in. Do NOT add a `ports:` mapping here; that re-exposes the
    # unauthenticated-over-plaintext surface this design removes.
    expose:
      - "8000"
    environment:
      - ACCUMULATE_NETWORK=testnet
      # Networks the proxy may serve per request (X-Accumulate-Network). Keep in
      # sync with the UI's selectable networks. The deploy network is implicit.
      - ALLOWED_NETWORKS=testnet
      - ALLOW_MAINNET=false
      # Lock CORS to your studio origin(s) in production (comma-separated).
      # The studio itself calls the proxy same-origin via the Vercel rewrite,
      # so leaving this empty does not break production.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - SESSION_TTL_SECONDS=1800
      - MAX_SESSIONS=500
      - PROXY_DEBUG_LOGGING=false
      - PROXY_LOG_LEVEL=INFO
      # Rate limits (slowapi syntax). Tune per deployment.
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_DEFAULT=120/minute
      - RATE_LIMIT_GENERATE=20/minute
      - RATE_LIMIT_FAUCET=10/minute
      - RATE_LIMIT_SIGN=60/minute

  caddy:
    image: caddy:2
    container_name: accumulate-caddy
    restart: unless-stopped
    depends_on:
      - sdk-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Defaults to an sslip.io name resolving to the host IP (no domain needed).
      - PROXY_DOMAIN=${PROXY_DOMAIN:-116-202-214-38.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
