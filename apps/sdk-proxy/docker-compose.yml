services:
  sdk-proxy:
    build: .
    container_name: accumulate-sdk-proxy
    restart: unless-stopped
    # Bind to localhost only. The proxy is reached exclusively through the host's
    # TLS-terminating reverse proxy (nginx — see deploy/nginx-sdk-proxy.conf.example),
    # never directly from the public internet. (Previously 0.0.0.0:8000, which
    # exposed the unauthenticated-over-plaintext surface publicly.)
    #
    # On a dedicated host with no existing reverse proxy, use
    # docker-compose.caddy.yml instead, which runs Caddy for automatic TLS.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ACCUMULATE_NETWORK=testnet
      - ALLOW_MAINNET=false
      # Lock CORS to your studio origin(s) in production (comma-separated). The
      # studio calls the proxy same-origin via the Vercel rewrite, so leaving
      # this empty does not break production.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - SESSION_TTL_SECONDS=1800
      - MAX_SESSIONS=500
      - PROXY_DEBUG_LOGGING=false
      - PROXY_LOG_LEVEL=INFO
      # Rate limits (slowapi syntax). Tune per deployment.
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_DEFAULT=120/minute
      - RATE_LIMIT_GENERATE=20/minute
      - RATE_LIMIT_FAUCET=10/minute
      - RATE_LIMIT_SIGN=60/minute
